<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="title desc">
<title id="title">Step 7: Test while parked — schematic illustration</title>
<desc id="desc">Schematic illustration. While parked, first capture a screenshot in another app and confirm it causes no analyzer request or speech. Then capture a genuine Uber offer and verify a fresh spoken response. Separately check Offer Analyzer history for the matching saved offer. Also verify that switching away during the wait or OCR blocks the request.</desc>
<rect width="640" height="460" rx="24" fill="#F3F7FA"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="28" y="24" width="82" height="30" rx="15" fill="#087E83"/>
<text x="43" y="46" font-size="16" fill="#FFFFFF" font-weight="700">STEP 7</text>
<text x="124" y="46" font-size="16" fill="#486174" font-weight="700">SETUP DIAGRAM</text>
<text x="28" y="91" font-size="30" fill="#132E41" font-weight="700">Test while parked</text>
<rect x="28" y="113" width="584" height="282" rx="16" fill="#FFFFFF" stroke="#D6E1E7" stroke-width="2"/><rect x="46" y="130" width="78" height="30" rx="15" fill="#E8EFFA"/><text x="59" y="152" font-size="16" fill="#132E41" font-weight="700">TEST 1</text><text x="142" y="151" font-size="23" fill="#132E41" font-weight="700">Screenshot another app</text><text x="142" y="181" font-size="20" fill="#486174">No analyzer request or speech.</text><path d="M 46 200 H 594" stroke="#D6E1E7" stroke-width="2"/><rect x="46" y="218" width="78" height="30" rx="15" fill="#E8EFFA"/><text x="59" y="240" font-size="16" fill="#132E41" font-weight="700">TEST 2</text><text x="142" y="239" font-size="23" fill="#132E41" font-weight="700">Capture an Uber offer</text><text x="142" y="269" font-size="20" fill="#486174">Check the fresh spoken response.</text><path d="M 46 288 H 594" stroke="#D6E1E7" stroke-width="2"/><rect x="46" y="307" width="78" height="30" rx="15" fill="#E3F3F0"/><text x="59" y="329" font-size="16" fill="#087E83" font-weight="700">TEST 3</text><text x="142" y="327" font-size="23" fill="#132E41" font-weight="700">Open Offer Analyzer history</text><text x="142" y="357" font-size="20" fill="#486174">Confirm that offer was saved.</text>
<text x="28" y="429" font-size="19" fill="#486174">Also check: switching away must stop the request.</text>
</g>
</svg>
