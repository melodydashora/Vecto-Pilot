<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="title desc">
<title id="title">Step 5: Check the app again — schematic illustration</title>
<desc id="desc">Schematic illustration. In addition to the macro foreground constraint, wrap OCR and all later actions in an If Uber Driver foreground check after the wait. Immediately before HTTP, use a second nested foreground If around HTTP, response parsing, notification and speech. Close both If blocks. The checks reduce app-switching errors but do not make capture atomic.</desc>
<rect width="640" height="460" rx="24" fill="#F3F7FA"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="28" y="24" width="82" height="30" rx="15" fill="#087E83"/>
<text x="43" y="46" font-size="16" fill="#FFFFFF" font-weight="700">STEP 5</text>
<text x="124" y="46" font-size="16" fill="#486174" font-weight="700">SETUP DIAGRAM</text>
<text x="28" y="91" font-size="30" fill="#132E41" font-weight="700">Check the app again</text>
<rect x="28" y="113" width="584" height="282" rx="16" fill="#FFFFFF" stroke="#D6E1E7" stroke-width="2"/><text x="48" y="145" font-size="21" fill="#132E41" font-weight="700">Macro constraint: Uber Driver foreground</text><path d="M 60 164 V 368 M 60 202 H 70 M 60 368 H 70 M 90 227 V 335 M 90 276 H 95 M 90 335 H 95" fill="none" stroke="#087E83" stroke-width="3"/><text x="80" y="181" font-size="19" fill="#486174">After any wait:</text><text x="80" y="210" font-size="21" fill="#132E41" font-weight="700">IF Uber Driver is still foreground</text><text x="104" y="241" font-size="21" fill="#132E41">OCR → build request</text><text x="104" y="282" font-size="21" fill="#132E41" font-weight="700">IF Uber Driver is still foreground</text><text x="128" y="316" font-size="19" fill="#132E41">HTTP → parse → notification → speech</text><text x="104" y="341" font-size="17" fill="#486174" font-weight="700">END IF</text><text x="80" y="375" font-size="17" fill="#486174" font-weight="700">END IF</text>
<text x="28" y="429" font-size="19" fill="#486174">Keep the full response and speech tail inside the guard.</text>
</g>
</svg>
